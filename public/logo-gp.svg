<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo Verde Padrão IFS com cantos arredondados (rx="100") -->
  <rect width="512" height="512" rx="100" fill="#2F9E41"/>
  
  <!-- Grupo principal centralizado na tela -->
  <g transform="translate(150, 45)">
    
    <!-- Figura Geométrica do IF (Branca) -->
    <g fill="#FFFFFF">
      <circle cx="30" cy="30" r="30"/>
      <rect x="76" y="0" width="60" height="60" rx="12"/>
      <rect x="152" y="0" width="60" height="60" rx="12"/>
      <rect x="0" y="76" width="60" height="60" rx="12"/>
      <rect x="76" y="76" width="60" height="60" rx="12"/>
      <rect x="0" y="152" width="60" height="60" rx="12"/>
      <rect x="76" y="152" width="60" height="60" rx="12"/>
      <rect x="152" y="152" width="60" height="60" rx="12"/>
      <rect x="0" y="228" width="60" height="60" rx="12"/>
      <rect x="76" y="228" width="60" height="60" rx="12"/>
    </g>
    
    <!-- Letras GP logo abaixo da figura -->
    <text x="106" y="415" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="144" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GP</text>
  </g>
</svg>
